name: Compatibility

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nip46-client-compat:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: lockfile
            install_cmd: ""
            signet_login_compat: "0"
          - name: latest nostr-tools
            install_cmd: npm install --no-save --package-lock=false nostr-tools@latest
            signet_login_compat: "0"
          - name: latest signet-login
            install_cmd: npm install --no-save --package-lock=false signet-login@latest
            signet_login_compat: "1"
          - name: latest signet-login + latest nostr-tools
            install_cmd: npm install --no-save --package-lock=false signet-login@latest nostr-tools@latest
            signet_login_compat: "1"

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install compatibility packages
        if: ${{ matrix.install_cmd != '' }}
        env:
          INSTALL_CMD: ${{ matrix.install_cmd }}
        # Unquoted on purpose: the matrix value is a fixed command line that must word-split.
        run: $INSTALL_CMD

      - name: Show tested client versions
        run: npm ls nostr-tools signet-login || true

      - name: NIP-46 compatibility tests
        run: npm run test:compat
        env:
          SIGNET_LOGIN_COMPAT: ${{ matrix.signet_login_compat }}

name: Signet Compatibility
run-name: Signet compatibility ${{ inputs.signet_login_ref || github.ref_name }}

# Consumer entry point for signet-login's release gate
# (signet-login/tools/check-consumer-compatibility.mjs dispatches this workflow
# and blocks the release on its result). It builds the signet-login *candidate*
# from the requested ref/sha, installs that tarball, and runs Lite's NIP-46
# compatibility suite against it. The PR/push self-guard lives in compatibility.yml.

on:
  workflow_dispatch:
    inputs:
      signet_login_ref:
        description: Signet Login ref or release tag requesting compatibility
        required: false
        type: string
      signet_login_sha:
        description: Signet Login commit SHA requesting compatibility
        required: false
        type: string
      signet_login_candidate:
        description: Build and install the Signet Login candidate package
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      signet_login_package_version:
        description: Signet Login candidate package version
        required: false
        type: string
      request_id:
        description: Compatibility request id
        required: false
        type: string

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Check out Signet Login candidate
        if: ${{ inputs.signet_login_candidate == 'true' }}
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: forgesworn/signet-login
          ref: ${{ inputs.signet_login_sha || inputs.signet_login_ref || 'main' }}
          path: signet-login-candidate
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm

      - name: Build Signet Login candidate package
        if: ${{ inputs.signet_login_candidate == 'true' }}
        id: signet_login_candidate
        working-directory: signet-login-candidate
        # Workflow inputs reach the shell only through env vars, never ${{ }} interpolation.
        env:
          EXPECTED_VERSION: ${{ inputs.signet_login_package_version }}
        run: |
          npm ci
          npm run build
          mkdir -p "$RUNNER_TEMP/signet-login-candidate"
          TARBALL="$(npm pack --pack-destination "$RUNNER_TEMP/signet-login-candidate" | tail -n 1)"
          VERSION="$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")"
          if [ -n "$EXPECTED_VERSION" ] && [ "$VERSION" != "$EXPECTED_VERSION" ]; then
            echo "Expected signet-login $EXPECTED_VERSION, built $VERSION"
            exit 1
          fi
          echo "tarball=$RUNNER_TEMP/signet-login-candidate/$TARBALL" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install locked dependencies
        run: npm ci

      - name: Install Signet Login candidate
        if: ${{ inputs.signet_login_candidate == 'true' }}
        env:
          CANDIDATE_TARBALL: ${{ steps.signet_login_candidate.outputs.tarball }}
        run: npm install --no-save "$CANDIDATE_TARBALL"

      - name: Show tested client versions
        run: npm ls signet-login nostr-tools || true

      - name: NIP-46 compatibility tests (against candidate)
        run: npm run test:compat
        env:
          SIGNET_LOGIN_COMPAT: "1"
          SIGNET_LOGIN_CANDIDATE_VERSION: ${{ steps.signet_login_candidate.outputs.version }}
